name: Unpack-GeoSite-Official-Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install v2dat
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Sync, Unpack and Push
        run: |
          # 1. Настройка Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 2. Очистка и Pull
          git pull origin main --rebase

          # 3. Распаковка (исходный файл source/geosite.dat)
          rm -rf output_raw && mkdir output_raw
          v2dat unpack geosite -o output_raw source/geosite.dat

          # 4. Очистка имен и фильтрация
          # Удаляем старую папку data целиком, чтобы убрать лишние файлы
          rm -rf data && mkdir -p data
          
          cd output_raw
          for f in geosite_*.txt; do
            [ -e "$f" ] || continue
            # Превращаем 'geosite_google.txt' в 'google'
            newname=$(basename "$f" | sed 's/^geosite_//;s/\.txt$//')
            
            # Копируем только если файл не пустой
            if [ -s "$f" ]; then
              cp "$f" "../data/$newname"
            fi
          done
          cd ..

          # 5. Коммит и отправка с использованием токена (решение ошибки 403)
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "Unpack geosite 1:1 - clean names"
            # Используем токен для авторизации пуша
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" main
          fi
