name: Unpack-GeoSite-Official-Final

on:
  workflow_dispatch: # Кнопка ручного запуска

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install v2dat
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Sync, Unpack and Push
        run: |
          # 1. Настройка Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 2. Pull изменений (защита от конфликтов)
          git pull origin main --rebase

          # 3. Распаковка через v2dat напрямую из _geosite.dat
          # Проверяем, существует ли исходный файл
          if [ ! -f "_geosite.dat" ]; then
            echo "❌ Ошибка: Файл _geosite.dat не найден в корне репозитория!"
            exit 1
          fi

          rm -rf output_raw && mkdir output_raw
          v2dat unpack geosite -o output_raw _geosite.dat

          # 4. Очистка имен и перенос в папку data
          rm -rf data && mkdir -p data
          
          if [ -d "output_raw" ]; then
            cd output_raw
            for f in geosite_*.txt; do
              [ -e "$f" ] || continue
              
              # Превращаем 'geosite_google.txt' в 'google'
              newname=$(echo "$f" | sed 's/^geosite_//;s/\.txt$//')
              
              # Копируем только если файл не пустой
              if [ -s "$f" ]; then
                cp "$f" "../data/$newname"
              fi
            done
            cd ..
          fi

          # 5. Коммит и отправка в репозиторий
          git add data/
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
          else
            git commit -m "Unpack geosite from _geosite.dat - clean names"
            git push origin main
          fi
