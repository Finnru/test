name: Unpack-GeoSite-Official-Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install v2dat
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Sync, Unpack and Push
        run: |
          # 1. Настройка Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 2. Обновление
          git pull origin main --rebase

          # 3. Пути
          REPO_ROOT=$(pwd)
          
          # 4. Очистка и создание папки data в корне репозитория
          # Сначала удаляем через git, чтобы он заметил изменения
          if [ -d "data" ]; then
            git rm -rf data/ || rm -rf data/
          fi
          mkdir -p data

          # 5. Распаковка
          rm -rf output_raw && mkdir -p output_raw
          v2dat unpack geosite -o "$REPO_ROOT/output_raw" "$REPO_ROOT/source/_geosite.dat"

          # 6. Обработка файлов (Важно: маска теперь соответствует логам _geosite_*.txt)
          shopt -s nullglob
          for f in "$REPO_ROOT/output_raw"/_geosite_*.txt; do
            [ -e "$f" ] || continue
            
            # Извлекаем чистое имя (из '_geosite_google.txt' делаем 'google')
            # 1. basename уберет путь
            # 2. первый sed уберет префикс _geosite_
            # 3. второй sed уберет расширение .txt
            newname=$(basename "$f" | sed 's/^_geosite_//;s/\.txt$//')
            
            if [ -s "$f" ]; then
              cp "$f" "$REPO_ROOT/data/$newname"
            fi
          done

          # 7. Фиксация изменений
          git add data/
          
          if git diff --staged --quiet; then
            echo "Изменений в папке data не обнаружено. Проверьте маску файлов."
            ls -la "$REPO_ROOT/output_raw" # Посмотрим что там на самом деле, если опять пусто
          else
            git commit -m "Update geosite data: extracted and cleaned"
            git push origin main
          fi
