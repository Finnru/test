name: Unpack-GeoSite-Official-Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install v2dat
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Sync, Unpack and Push
        run: |
          # 1. Настройка Git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 2. Pull (защита от rejected)
          git pull origin main --rebase

          # 3. Проверка наличия файла в папке source/
          if [ ! -f "source/_geosite.dat" ]; then
            echo "❌ Ошибка: Файл source/_geosite.dat не найден!"
            exit 1
          fi

          # 4. Распаковка во временную папку
          rm -rf output_raw && mkdir output_raw
          v2dat unpack geosite -o output_raw source/_geosite.dat

          # 5. Полная очистка папки data/ перед наполнением
          rm -rf data && mkdir -p data

          # 6. Обработка файлов и перенос в data/
          if [ -d "output_raw" ]; then
            cd output_raw
            for f in geosite_*.txt; do
              [ -e "$f" ] || continue
              
              # Убираем префикс geosite_ и расширение .txt
              newname=$(basename "$f" | sed 's/^geosite_//;s/\.txt$//')
              
              # Копируем только непустые файлы в корень папки data
              if [ -s "$f" ]; then
                cp "$f" "../data/$newname"
              fi
            done
            cd ..
          fi

          # 7. Коммит и отправка
          git add data/
          if git diff --staged --quiet; then
            echo "Изменений в data/ не обнаружено"
          else
            git commit -m "Unpack geosite 1:1 - clean names"
            git push origin main
          fi
